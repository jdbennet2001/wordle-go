name: package-deploy

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Path to the deployment manifest (for registry + region)
        required: false
        default: deploy/images.yaml
        type: string
      bundle-repository:
        description: ECR repository name for the install bundle
        required: false
        default: wordle-deploy
        type: string
      bundle-tag:
        description: Tag for the install bundle
        required: false
        default: latest
        type: string

  workflow_call:
    inputs:
      manifest:
        required: false
        default: deploy/images.yaml
        type: string
      bundle-repository:
        required: false
        default: wordle-deploy
        type: string
      bundle-tag:
        required: false
        default: latest
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

env:
  MANIFEST: ${{ inputs.manifest }}
  BUNDLE_REPO: ${{ inputs.bundle-repository }}
  BUNDLE_TAG: ${{ inputs.bundle-tag }}

jobs:
  package:
    name: Package and publish install bundle to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load deployment config
        id: cfg
        run: |
          set -euo pipefail
          [ -f "$MANIFEST" ] || { echo "::error::Manifest not found: $MANIFEST"; exit 1; }
          region=$(yq '.aws.region' "$MANIFEST")
          ecr=$(yq '.registries.ecr' "$MANIFEST")
          for v in region ecr; do
            if [ "${!v}" = "null" ] || [ -z "${!v}" ]; then
              echo "::error::Missing required manifest value: $v"; exit 1
            fi
          done
          { echo "region=$region"; echo "ecr=$ecr"; } >> "$GITHUB_OUTPUT"
          echo "Region=$region  ECR=$ecr"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.cfg.outputs.region }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create bundle repository if it does not exist
        env:
          AWS_REGION: ${{ steps.cfg.outputs.region }}
        run: |
          set -euo pipefail
          if aws ecr describe-repositories \
               --repository-names "$BUNDLE_REPO" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Repository '$BUNDLE_REPO' exists."
          else
            echo "Creating repository '$BUNDLE_REPO'..."
            aws ecr create-repository \
              --repository-name "$BUNDLE_REPO" --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true >/dev/null
          fi

      - name: Build and push install bundle
        uses: docker/build-push-action@v6
        with:
          context: ./deploy
          file: ./deploy/Dockerfile.deploy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.cfg.outputs.ecr }}/${{ env.BUNDLE_REPO }}:${{ env.BUNDLE_TAG }}

      - name: Summary
        run: |
          {
            echo "### Install bundle published"
            echo ""
            echo "- Image: \`${{ steps.cfg.outputs.ecr }}/${BUNDLE_REPO}:${BUNDLE_TAG}\`"
            echo "- Contents: docker-compose.yml, .env.ecr, install.sh"
            echo ""
            echo "Hand developers \`deploy/wordle-install.sh\` plus their ECR credentials."
          } >> "$GITHUB_STEP_SUMMARY"
