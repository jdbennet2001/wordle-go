name: remove-ecr

# Prefix sweep: deletes ALL ECR repositories whose name starts with `prefix`,
# removing the only billable footprint of this PoC (ECR image storage). IAM
# users/policies are free and are not touched here.

on:
  workflow_dispatch:
    inputs:
      aws-region:
        description: AWS region to sweep
        required: false
        default: eu-west-1
        type: string
      prefix:
        description: Delete every ECR repository whose name starts with this prefix
        required: false
        default: wordle-
        type: string
      confirm:
        description: Re-type the prefix exactly to confirm deletion of ALL matching repositories
        required: true
        type: string

  workflow_call:
    inputs:
      aws-region:
        required: false
        default: eu-west-1
        type: string
      prefix:
        required: false
        default: wordle-
        type: string
      confirm:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

env:
  AWS_REGION: ${{ inputs.aws-region }}
  PREFIX: ${{ inputs.prefix }}

jobs:
  remove:
    name: Sweep ECR repositories by prefix
    runs-on: ubuntu-latest

    steps:
      - name: Verify prefix and confirmation
        run: |
          set -euo pipefail
          if [ -z "${PREFIX}" ] || [ "${PREFIX}" = "*" ]; then
            echo "::error::prefix must be a non-empty, specific string — an empty or '*' prefix would match every repository in the account."
            exit 1
          fi
          if [ "${{ inputs.confirm }}" != "${PREFIX}" ]; then
            echo "::error::Confirmation '${{ inputs.confirm }}' does not match prefix '${PREFIX}'. Aborting before touching AWS."
            exit 1
          fi
          echo "Confirmed: will sweep repositories starting with '${PREFIX}'."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete matching repositories
        run: |
          set -euo pipefail

          repos=$(aws ecr describe-repositories --region "$AWS_REGION" \
            --query "repositories[?starts_with(repositoryName, '${PREFIX}')].repositoryName" \
            --output text)

          if [ -z "$repos" ]; then
            echo "No repositories match prefix '${PREFIX}' in ${AWS_REGION}. Nothing to remove."
            {
              echo "### remove-ecr"
              echo ""
              echo "No repositories matched prefix \`${PREFIX}\` — nothing to remove."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Repositories to delete (prefix '${PREFIX}'):"
          for r in $repos; do echo "  - $r"; done

          {
            echo "### Removed ECR repositories (prefix: \`${PREFIX}\`)"
            echo ""
            echo "| Repository | Status |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          count=0
          for r in $repos; do
            echo "Deleting ${r} (and all images in it)..."
            # --force deletes the repository even if it still contains images.
            aws ecr delete-repository --repository-name "$r" --region "$AWS_REGION" --force >/dev/null
            echo "| \`${r}\` | deleted |" >> "$GITHUB_STEP_SUMMARY"
            count=$((count + 1))
          done

          echo "Done. Deleted ${count} repository(ies)."
